name: 🚀 FluxMQ Simple Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-ubuntu-24.04
            target: x86_64-unknown-linux-musl
            name: fluxmq-linux-x64

          - os: depot-windows-2025-4
            target: x86_64-pc-windows-msvc
            name: fluxmq-windows-x64.exe

          - os: depot-macos-latest
            target: x86_64-apple-darwin
            name: fluxmq-macos-x64

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: ⚡ Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install Linux musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Linux musl artifact
        if: runner.os == 'Linux'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} --manifest-path core/Cargo.toml

      - name: Build macOS and Windows artifacts
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }} --manifest-path core/Cargo.toml

      - name: 📦 Package
        shell: bash
        run: |
          cd core
          if [[ "${{ matrix.os }}" == "depot-windows-2025-4" ]]; then
            cp target/${{ matrix.target }}/release/fluxmq.exe ../${{ matrix.name }}
          else
            cp target/${{ matrix.target }}/release/fluxmq ../${{ matrix.name }}
            chmod +x ../${{ matrix.name }}
          fi

      - name: 📄 Generate checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256
          else
            shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256
          fi

      - name: 🎉 Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
